name: Apple paired-recovery metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/recovery-metadata.yml'
      - 'scripts/recovery_metadata.py'
      - 'tests/test_recovery_metadata.py'
      - 'docs/paired-recovery.md'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Read bounded Apple archive metadata only
        run: python3 scripts/recovery_metadata.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: METADATA-ONLY-Apple-J713-recovery
          path: reports/recovery-metadata.json
          retention-days: 7
          if-no-files-found: error
