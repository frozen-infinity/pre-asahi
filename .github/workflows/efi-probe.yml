name: ARM64 EFI discovery probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulated-efi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Install compiler and emulator on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm qemu-efi-aarch64
      - name: Build and execute the actual ARM64 EFI probe in EDK2
        run: |
          python3 scripts/efi_probe.py --clang clang --linker lld-link \
            --firmware-code /usr/share/AAVMF/AAVMF_CODE.fd \
            --firmware-vars /usr/share/AAVMF/AAVMF_VARS.fd
      - name: Retain EFI executable and emulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EMULATED-ONLY-arm64-efi-probe
          retention-days: 7
          if-no-files-found: warn
          path: |
            work/efi-probe/attempt-*/pre-asahi-probe.efi
            work/efi-probe/attempt-*/result.json
            work/efi-probe/attempt-*/efi-console.log
