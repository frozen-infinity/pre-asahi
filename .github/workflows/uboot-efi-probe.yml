name: Selected-source U-Boot EFI probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/uboot-efi-probe.yml'
      - 'scripts/uboot_efi_probe.py'
      - 'tests/test_uboot_efi_probe.py'
      - 'tests/test_efi_probe.py'
      - 'tests/efi-*-host.c'
      - 'efi/**'
      - 'scripts/efi_probe.py'

permissions:
  contents: read

jobs:
  qemu-uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Install cross-build and emulator tools on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git bc bison flex \
            python3 python3-dev python3-pyelftools python3-setuptools swig pkg-config \
            libssl-dev libgnutls28-dev uuid-dev device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld qemu-system-arm
      - name: Build pinned U-Boot QEMU profile and test real EFI Fixup and table publication
        run: |
          set -o pipefail
          python3 scripts/uboot_efi_probe.py 2>&1 | tee uboot-efi-runner.log
      - name: Retain emulation evidence and own EFI executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QEMU-ONLY-selected-uboot-efi
          retention-days: 7
          if-no-files-found: warn
          path: |
            uboot-efi-runner.log
            work/uboot-efi-probe/attempt-*/result.json
            work/uboot-efi-probe/attempt-*/*console.log
            work/uboot-efi-probe/attempt-*/qemu-resolved.config
            work/uboot-efi-probe/attempt-*/*.efi
