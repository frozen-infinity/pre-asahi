name: Stage-1 proxy-only build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage1-proxy.yml'
      - 'scripts/stage1_proxy.py'
      - 'tests/test_stage1_proxy.py'
      - 'configs/candidate-stack.json'
      - 'docs/first-native-stage.md'

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Install build tools in disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld make git
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-unknown-none-softfloat
      - name: Compile unmodified pinned Aura with isolated proxy-only configuration
        run: |
          set -o pipefail
          python3 scripts/stage1_proxy.py --llvm-dir "$(llvm-config --bindir)" 2>&1 | tee stage1-proxy-runner.log
      - name: Retain build review evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BUILD-ONLY-stage1-proxy-review
          retention-days: 7
          if-no-files-found: warn
          path: |
            stage1-proxy-runner.log
            work/stage1-proxy/attempt-*/result.json
            work/stage1-proxy/attempt-*/build.log
            work/stage1-proxy/attempt-*/effective-macros.txt
