name: Portable recovery-check tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/recovery-portable.yml'
      - 'scripts/inspect_recovery_portable.py'
      - 'scripts/prepare_recovery_transfer.py'
      - 'tests/test_recovery_portable.py'
      - 'docs/second-mac-check.md'

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
