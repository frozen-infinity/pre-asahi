name: Candidate stack build

on:
  workflow_dispatch:
    inputs:
      component:
        description: Build-only candidate component
        type: choice
        default: both
        options: [both, aura, kernel-config]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.select.outputs.components }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n ci/candidate-container.sh
      - id: select
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 - <<'PY'
          import json, os
          selected = os.environ['COMPONENT']
          assert selected in ('both', 'aura', 'kernel-config')
          choices = ['aura', 'kernel-config'] if selected == 'both' else [selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('components=' + json.dumps(choices) + '\n')
          PY
  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: ${{ fromJSON(needs.validate.outputs.components) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build in disposable ARM container
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -o pipefail
          python3 scripts/candidate_build.py --component "$COMPONENT" 2>&1 | tee candidate-runner.log
      - name: Retain unqualified results and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNQUALIFIED-candidate-${{ matrix.component }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            work/candidate-stack/*/result/**
            work/candidate-stack/*/build.log
            candidate-runner.log
